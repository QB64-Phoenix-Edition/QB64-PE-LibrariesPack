[LIBRARY DETAILS]
FullName="SPV Video Library"
Version="1.0 (06-Nov-2026)"
License="MIT-0 (https://opensource.org/license/mit-0)"
ShortDesc="This library lets a QB64 program open and play SPV videos through handles, in the same style as _SNDOPEN and _SNDPLAY. You open a video and get a handle back, then pass that handle to play, pause, seek and close commands. Several videos can play at once. Supports MJPG (VTYPE 99) and the legacy sprite / bitmap / VGA / ModeX types."
FullDocs=SPV-Handles.md
Author="Tony3068 (aka ahenry3068)"
