[LIBRARY DETAILS]
FullName="VLC Video Library"
Version="1.0 (06-Nov-2026)"
License="MIT-0 (https://opensource.org/license/mit-0)"
ShortDesc="This library lets a QB64 program open and play standard videos (MP4, MKV, AVI, WebM, MOV, streams) via 'libvlc 3.x' through handles, in the same style as _SNDOPEN and _SNDPLAY. You open a video and get a handle back, then pass that handle to play, pause, seek and close commands. Several videos can play at once."
