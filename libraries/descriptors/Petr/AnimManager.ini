FullName="Animation Manager Library"
Version="0.6 (13-Apr-2026)"
License="MIT (https://opensource.org/license/mit)"
ShortDesc="The animation manager library for QB64-PE provides a unified API for the animation formats APNG, GIF89a, FLI, FLC, ANIM and ANI. Doesn't matter which format it is, the calls to load, play, stop, pause, single step etc. are always the same regardless of the animation format. This makes it easy to deal with a whole bunch of different animation formats in your application through one standardized set of functions.
