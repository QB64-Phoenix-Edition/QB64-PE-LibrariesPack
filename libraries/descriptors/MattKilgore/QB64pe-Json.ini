ShortDesc="This is a JSON parsing and creation library for QB64-PE. Given a string containing JSON, it can convert it into a Json object which can then be queried to retrieve the values in the JSON. Additionally it contains a variety of 'JsonTokenCreate*' functions which can be used to build up a Json object, which can then be rendered into a String version of that JSON."
